# Screen locker, replacing noctalia's built-in one.
#
# The reason for the swap is $PAMPROMPT below. This account is systemd-homed
# with a FIDO2 token, so unlocking is a multi-prompt PAM conversation: the
# password first, then "Security token PIN:", then "Sorry, retry security token
# PIN:" if that was wrong. hyprlock re-prompts whenever the prompt text changes
# and clears the field, so a typo costs one of the token's eight PIN retries.
# A locker that replays one buffered string at every prompt spends three at once
# and blocks the token until it is physically reinserted.

general {
    hide_cursor = true
    # No grace period: waking must always authenticate.
    grace = 0
    # Empty input has to reach PAM — that is what lets pam_systemd_home move the
    # conversation on from the password to the token PIN.
    ignore_empty_input = false
}

auth {
    pam {
        enabled = true
        # /etc/pam.d/hyprlock, written by run_onchange_after_45-pam-u2f.sh.
        module = hyprlock
    }

    fingerprint {
        enabled = false
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 340, 55
    outline_thickness = 2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(f7f1ff)
    fade_on_empty = false
    # The prompt is the whole point: it tells you whether PAM currently wants the
    # account password or the token PIN, and flags a retry after a bad PIN.
    placeholder_text = <i><span foreground="##cdc8d0">$PAMPROMPT</span></i>
    fail_text = <i>$PAMFAIL</i>
    fail_color = rgb(fc618d)
    check_color = rgb(fce566)
    capslock_color = rgb(fd9353)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = Cantarell
    color = rgb(f7f1ff)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    font_size = 18
    font_family = Cantarell
    color = rgb(cdc8d0)
    position = 0, 20
    halign = center
    valign = center
}
