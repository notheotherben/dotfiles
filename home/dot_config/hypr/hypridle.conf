# Idle handling, moved off noctalia's idle manager when its lock screen was
# disabled in favour of hyprlock. noctalia's idle behaviours are all switched
# off in its config.toml so the two do not both arm timers.
#
# Everything routes through `loginctl lock-session` rather than calling hyprlock
# directly, so the logind Lock signal, the session panel button, and the idle
# timer all end up in the same place.
#
# DPMS goes through the Lua form. Hyprland 0.56 made `hyprctl dispatch` a
# shorthand for `hl.dispatch(...)`, so the old bare `hyprctl dispatch dpms off`
# is parsed as Lua and dies with "')' expected near 'off'" -- it had been failing
# silently, which is why the screen never actually blanked. The single quotes
# matter: hypridle runs these through a shell.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# Blanking has to be its own listener 15s behind the lock, not `loginctl
# lock-session && hyprctl dispatch dpms off`. Two reasons that chain cannot
# work: `loginctl` returns as soon as the Lock signal is sent, so the dpms off
# fires before lock_cmd has even spawned hyprlock; and hyprlock's surface wakes
# the monitors as it comes up. The 60s listener has already fired by then and
# nothing re-arms without user activity, so the screens stayed on until morning.
listener {
    timeout = 125
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}