# Idle handling, moved off noctalia's idle manager when its lock screen was
# disabled in favour of hyprlock. noctalia's idle behaviours are all switched
# off in its config.toml so the two do not both arm timers.
#
# Everything routes through `loginctl lock-session` rather than calling hyprlock
# directly, so the logind Lock signal, the session panel button, and the idle
# timer all end up in the same place.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Blank the screen after 60 seconds of idle, and lock the session after 10 minutes.
listener {
    timeout = 60
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}