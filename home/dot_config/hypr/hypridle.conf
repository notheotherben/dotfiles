# Idle handling, moved off noctalia's idle manager when its lock screen was
# disabled in favour of hyprlock. noctalia's idle behaviours are all switched
# off in its config.toml so the two do not both arm timers.
#
# Everything routes through `loginctl lock-session` rather than calling hyprlock
# directly, so the logind Lock signal, the session panel button, and the idle
# timer all end up in the same place.
#
# Waking is not left to on-resume alone: misc.mouse_move_enables_dpms and
# misc.key_press_enables_dpms (config/misc.lua) let input undo DPMS by itself,
# so a dispatch that fails cannot strand the session on dark panels.
#
# hypridle only reads this file at startup, so an edit here means nothing until
# the daemon restarts -- run_onchange_after_48-hypridle.sh does that.
#
# DPMS goes through the Lua form. Hyprland 0.56 made `hyprctl dispatch` a
# shorthand for `hl.dispatch(...)`, so the old bare `hyprctl dispatch dpms off`
# is parsed as Lua and dies with "')' expected near 'off'" -- it had been failing
# silently, which is why the screen never actually blanked. The single quotes
# matter: hypridle runs these through a shell.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150
    on-timeout = hyprctl hyprsunset gamma 20
    on-resume = hyprctl hyprsunset reset gamma
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && hyprctl hyprsunset reset gamma
}

listener {
    timeout = 86400
    on-timeout = systemctl suspend
}