# Global mise configuration — deployed by chezmoi to ~/.config/mise/config.toml
#
#   Install/upgrade tools with:  mise install   (or `mise up`)
#
# mise is reserved for per-project language runtimes plus git-tool (which has
# no Homebrew formula). Everything else lives in ~/.Brewfile.

[tools]
node = "lts"
go = "latest"
deno = "latest"

# git-tool ships prebuilt release binaries but has no Homebrew tap, so we pull
# it straight from GitHub releases via mise's `ubi` backend.
"github:SierraSoftworks/git-tool" = { version = "latest", exe = "git-tool", matching = "darwin-arm64" }

[env]
# Replaces the old nix `environment.variables` block.
VAULT_ADDR = "https://vault.sierrasoftworks.com"
VAULT_SSH_ROLE = "admin"
GITTOOL_CONFIG = "{{env.HOME}}/dev/git-tool.yml"
OP_BIOMETRIC_UNLOCK_ENABLED = "true"

# Replaces the old nix shellInit `fish_add_path` / home.sessionPath entries.
# Applied to every shell that activates mise.
_.path = [
  "{{env.HOME}}/.local/bin",
  "{{env.HOME}}/go/bin",
  "{{env.HOME}}/.cargo/bin",
  "{{env.HOME}}/Programs"
]
