# CachyOS ships lucidglyph, whose /etc/environment.d file turns on FreeType stem
# darkening for every font and keeps darkening glyphs up to 40ppem. On these
# 130-140 DPI panels with a dark theme that makes text look bold, smeared and
# "blown out". This file sorts after lucidglyph-freetype-properties.conf, so it
# wins and restores FreeType's default (no darkening).
FREETYPE_PROPERTIES="autofitter:no-stem-darkening=1 cff:no-stem-darkening=1 type1:no-stem-darkening=1 t1cid:no-stem-darkening=1"
