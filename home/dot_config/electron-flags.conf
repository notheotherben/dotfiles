--enable-features=WaylandWindowDecorations,AllowQt
# --ozone-platform-hint=wayland (removed in Electron 38)
--ozone-platform=wayland
# GTK4 works better on Wayland.
--gtk-version=4
# Use KWallet (kwalletd6) for password storage. Value must be UNQUOTED: the
# Arch wrapper scripts word-split this file without eval, so quotes would be
# passed through literally and rejected as an invalid backend name.
--password-store=kwallet6
# Force SDR color space for Electron apps.
--disable-features=WaylandWpColorManagerV1