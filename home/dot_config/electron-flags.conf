# WaylandLinuxDrmSyncobj enables the Wayland explicit-sync protocol
# (linux-drm-syncobj-v1). Without it Electron hands DMABUF buffers to the
# compositor using implicit sync only, which NVIDIA does not handle reliably,
# producing flickering and stale tiles from other windows. Supported since
# Electron 35 / Chromium 134. It must be merged into this single
# --enable-features value: a second --enable-features line would override this
# one rather than add to it.
# See https://wiki.hypr.land/Nvidia/#flickering-in-electron--cef-apps
--enable-features=WaylandWindowDecorations,AllowQt,WaylandLinuxDrmSyncobj
# --ozone-platform-hint=wayland (removed in Electron 38)
--ozone-platform=wayland
# GTK4 works better on Wayland.
--gtk-version=4
# Use KWallet (kwalletd6) for password storage. Value must be UNQUOTED: the
# Arch wrapper scripts word-split this file without eval, so quotes would be
# passed through literally and rejected as an invalid backend name.
--password-store=kwallet6
# Force SDR color space for Electron apps.
--disable-features=WaylandWpColorManagerV1