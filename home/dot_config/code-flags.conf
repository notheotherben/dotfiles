# Read by /usr/bin/code (visual-studio-code-bin), which strips # comments and
# word-splits this file, so values must be UNQUOTED.
#
# Enable the Wayland explicit-sync protocol (linux-drm-syncobj-v1). Without it
# Electron hands DMABUF buffers to the compositor using implicit sync only,
# which NVIDIA does not handle reliably -- the result is flickering and stale
# tiles from other windows. Supported since Electron 35 / Chromium 134.
# See https://wiki.hypr.land/Nvidia/#flickering-in-electron--cef-apps
--enable-features=WaylandLinuxDrmSyncobj
