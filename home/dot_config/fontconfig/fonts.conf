<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    lucidglyph's 20-lucidglyph-embolden.conf synthetically emboldens every glyph
    under 14px, which combined with its stem darkening makes small UI text look
    fat and blurry. This user config loads later (via 50-user.conf) and undoes it.
    Stem darkening itself is disabled in ~/.config/environment.d/no-stem-darkening.conf.
  -->
  <match target="font">
    <edit name="embolden" mode="assign"><bool>false</bool></edit>
  </match>

  <!--
    Full hinting snaps stems to the pixel grid. On the 139 DPI QD-OLED, slight
    hinting with grayscale antialiasing leaves stems straddling pixels and text
    reads as soft. GTK/Chromium apps take this from gsettings instead, which
    run_onchange_after_50-font-rendering.sh sets to 'full' to match.
  -->
  <match target="pattern">
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

  <!--
    Grayscale antialiasing, deliberately. The AW3225QF is a QD-OLED whose
    subpixels are stacked vertically (green high, red/blue low), so bright thin
    strokes show a cyan fringe along their top edge. Subpixel rendering was
    tried (vbgr and vrgb only shift coverage by a third of a pixel) and made no
    visible difference on the OLED while adding colour fringes on the IPS panel.
    lucidglyph already forces rgba=none; this pins it in case that package goes.
  -->
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!--
    Web pages that ask for Georgia / Times (Ghost's editor, many blogs) fall
    through to the Times clones (Nimbus Roman, Tinos, Liberation Serif). Those
    are print faces with hairline strokes that all but vanish on a dark theme.
    Send them to Noto Serif instead, which has even stroke weight. binding="same"
    makes Firefox treat the substitute as the real family rather than skipping it.
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif</string></edit>
  </match>
</fontconfig>
